name: Release Jellyfin Edition

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.PODIUM_UPDATE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" ]]; then
            echo "Configure the PODIUM_UPDATE_KEYSTORE_BASE64 Actions secret before releasing." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/podium-update.jks"

      - name: Build signed update APK
        shell: bash
        env:
          PODIUM_KEYSTORE_FILE: ${{ runner.temp }}/podium-update.jks
          PODIUM_KEYSTORE_PASSWORD: ${{ secrets.PODIUM_UPDATE_KEYSTORE_PASSWORD }}
          PODIUM_KEY_ALIAS: ${{ secrets.PODIUM_UPDATE_KEY_ALIAS }}
          PODIUM_KEY_PASSWORD: ${{ secrets.PODIUM_UPDATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_code=$((GITHUB_RUN_NUMBER + 7))
          ./gradlew :app:assembleRelease \
            -Ppodium.applicationIdSuffix=.debug \
            -Ppodium.versionName="$version" \
            -Ppodium.versionCode="$version_code"
          cp app/build/outputs/apk/release/app-release.apk podium.apk
          sha256sum podium.apk > podium.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes are missing: $notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Podium Jellyfin Edition ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            podium.apk#podium.apk \
            podium.apk.sha256
